<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configure bippity for your school</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--txt:#1d1d1f;--dim:#6e6e73;--faint:#aeaeb2;--line:#e8e8ec;--blue:#0a6cff;--lime:#eef7a1;--radius:20px;--shadow:0 6px 24px rgba(0,0,0,.05)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:28px 20px 60px}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.4px;text-decoration:none;color:var(--txt)}
  .logo span{color:var(--blue)}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px;margin-top:22px}
  h1{font-size:32px;letter-spacing:-.6px;line-height:1.15}
  .sub{color:var(--dim);font-size:16.5px;line-height:1.5;margin-top:8px}
  .dots{display:flex;gap:7px;margin:22px 0 4px}
  .dots i{width:9px;height:9px;border-radius:50%;background:#dcdce1}
  .dots i.on{background:#1d1d1f}
  label{display:block;font-size:14px;color:var(--dim);margin:16px 0 6px;font-weight:600}
  input[type=text],input[type=email],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-size:16px;font-family:inherit;background:#fff}
  textarea{resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14.5px;cursor:pointer;user-select:none}
  .chip.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
  .row{display:flex;gap:10px;margin-top:26px}
  .btn{border:0;border-radius:999px;padding:13px 24px;font-size:16px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.dark{background:#1d1d1f;color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}
  .hint{color:var(--faint);font-size:13.5px;margin-top:8px;line-height:1.45}
  .err{color:#d70015;font-size:14.5px;margin-top:12px;min-height:20px}
  .know{background:#f7f7f9;border-radius:14px;padding:14px 16px;margin-top:10px}
  .know b{display:block;margin-bottom:6px}
  .know li{margin:4px 0 4px 18px;font-size:15px;line-height:1.45}
  .hp{position:absolute;left:-9999px;top:-9999px}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/school">bippity<span>.</span></a>
  <div class="card">
    <div id="app"></div>
  </div>
  <p class="hint" style="text-align:center;margin-top:16px">Everything you write here becomes your bots' working context — stored with your school, editable any time in Settings. Bots still can't promise seats, aid or prices: those approvals are always yours.</p>
</div>
<script>
  const $=id=>document.getElementById(id);
  const P={schoolName:'',city:'',ages:[],seats:'',seatsOpen:'',tuition:'',tourDays:[],tourTimes:'',approach:[],about:'',faqs:'',neverPromise:[],neverNotes:'',channels:[],founderName:'',email:'',plan:'free'};
  let STEP=0;
  const esc=s=>String(s||'').replace(/</g,'&lt;');
  function chips(id,opts,cur){return '<div class="chips" id="'+id+'">'+opts.map(o=>'<span class="chip'+(cur.includes(o)?' on':'')+'" data-v="'+o+'">'+o+'</span>').join('')+'</div>';}
  function wireChips(id,key){document.querySelectorAll('#'+id+' .chip').forEach(c=>c.onclick=()=>{c.classList.toggle('on');P[key]=[...document.querySelectorAll('#'+id+' .chip.on')].map(x=>x.dataset.v);});}
  function dots(){return '<div class="dots">'+[0,1,2,3].map(i=>'<i class="'+(i===STEP?'on':'')+'"></i>').join('')+'</div>';}
  function render(){
    const A=$('app');
    if(STEP===0){A.innerHTML=dots()+'<h1>First, your school</h1><p class="sub">The basics your bots will quote back to families — exactly as you write them.</p>'
      +'<label>School name</label><input type="text" id="f_schoolName" value="'+esc(P.schoolName)+'" placeholder="Willow Creek Microschool">'
      +'<label>City &amp; state</label><input type="text" id="f_city" value="'+esc(P.city)+'" placeholder="Sacramento, CA">'
      +'<label>Ages you serve</label>'+chips('c_ages',['K–2 (5–7)','Elementary (7–11)','Middle (11–14)','High school (14–18)','Mixed ages'],P.ages)
      +'<div class="grid2"><div><label>Total seats</label><input type="number" id="f_seats" value="'+esc(P.seats)+'" placeholder="22"></div><div><label>Seats open now</label><input type="number" id="f_seatsOpen" value="'+esc(P.seatsOpen)+'" placeholder="2"></div></div>'
      +'<label>Tuition (as you say it to families)</label><input type="text" id="f_tuition" value="'+esc(P.tuition)+'" placeholder="$8,000 / year">'
      +'<div class="err" id="err"></div><div class="row"><button class="btn primary" onclick="next1()">Continue</button></div>';
      wireChips('c_ages','ages');return;}
    if(STEP===1){A.innerHTML=dots()+'<h1>Tours &amp; how families find you</h1><p class="sub">Your bots offer the tour times you set — two choices at a time, because two choices convert.</p>'
      +'<label>Tour days</label>'+chips('c_days',['Mon','Tue','Wed','Thu','Fri','Sat'],P.tourDays)
      +'<label>Tour times (in your words)</label><input type="text" id="f_tourTimes" value="'+esc(P.tourTimes)+'" placeholder="Thu 10:00 AM, Sat 9:00 AM">'
      +'<label>Where inquiries come from</label>'+chips('c_channels',['Website form','Facebook','Instagram','Email','Phone / text','Referrals'],P.channels)
      +'<div class="err" id="err"></div><div class="row"><button class="btn ghost" onclick="STEP=0;save1();render()">Back</button><button class="btn primary" onclick="next2()">Continue</button></div>';
      wireChips('c_days','tourDays');wireChips('c_channels','channels');return;}
    if(STEP===2){A.innerHTML=dots()+'<h1>Your voice &amp; your context</h1><p class="sub">This is the part no generic tool has: what makes <b>your</b> school worth choosing, in your words. Your bots answer from this — and only this.</p>'
      +'<label>Your approach</label>'+chips('c_appr',['Montessori','Waldorf','Classical','Nature-based','Faith-based','Project-based','Reggio-inspired','Mixed'],P.approach)
      +'<label>What makes your school special</label><textarea id="f_about" rows="4" placeholder="Small classes on a working homestead. Kids care for chickens, read under the oak, and present a project every Friday…">'+esc(P.about)+'</textarea>'
      +'<label>Questions families always ask — and your answers</label><textarea id="f_faqs" rows="4" placeholder="Do you offer aftercare? Yes, until 5 PM, $150/mo.&#10;Lunch? Families pack lunch; Fridays we cook together.">'+esc(P.faqs)+'</textarea>'
      +'<label>Never promise (bots escalate these to you)</label>'+chips('c_never',['A seat','Financial aid','A specific price','A specific teacher','Start dates'],P.neverPromise)
      +'<label>Anything else the bots must know?</label><textarea id="f_neverNotes" rows="2" placeholder="We are peanut-free. Tours pause in December.">'+esc(P.neverNotes)+'</textarea>'
      +'<div class="err" id="err"></div><div class="row"><button class="btn ghost" onclick="STEP=1;save2();render()">Back</button><button class="btn primary" onclick="next3()">Continue</button></div>';
      wireChips('c_appr','approach');wireChips('c_never','neverPromise');return;}
    if(STEP===3){A.innerHTML=dots()+'<h1>Create your team</h1><p class="sub">Your profile is created with your email — that is where your bots\' webhook links and setup notes go. Start free; upgrade only if you outgrow it.</p>'
      +'<label>Your name</label><input type="text" id="f_founderName" value="'+esc(P.founderName)+'" placeholder="Your full name">'
      +'<label>Email</label><input type="email" id="f_email" value="'+esc(P.email)+'" placeholder="you@yourschool.org">'
      +'<label>Plan</label><select id="f_plan"><option value="free"'+(P.plan==='free'?' selected':'')+'>Free — 1 workspace, start today</option><option value="pro"'+(P.plan==='pro'?' selected':'')+'>Pro $20/mo — 5 workspaces</option><option value="max"'+(P.plan==='max'?' selected':'')+'>Max $200/mo — hosted computers</option></select>'
      +'<input type="text" id="company_website" class="hp" tabindex="-1" autocomplete="off">'
      +'<div class="err" id="err"></div><div class="row"><button class="btn ghost" onclick="STEP=2;save3();render()">Back</button><button class="btn dark" id="createBtn" onclick="create()">Create my enrollment team</button></div>';
      return;}
    A.innerHTML='<h1>Your team is set up 🎉</h1><p class="sub">'+esc(P.founderName?P.founderName.split(' ')[0]+', y':'Y')+'our bots now work from <b>'+esc(P.schoolName)+'</b>\'s own context — not a template.</p>'
      +'<div class="know"><b>What your bots now know</b><ul>'
      +'<li>'+esc(P.schoolName)+' — '+esc(P.city)+', ages '+esc(P.ages.join(', ')||'—')+'</li>'
      +'<li>'+esc(P.seats)+' seats, '+esc(P.seatsOpen)+' open · tuition '+esc(P.tuition)+'</li>'
      +'<li>Tours: '+esc(P.tourDays.join(', ')||'—')+' · '+esc(P.tourTimes)+'</li>'
      +(P.about?'<li>Your story, in your words, is their answer book</li>':'')
      +(P.neverPromise.length?'<li>Never promised, always escalated to you: '+esc(P.neverPromise.join(', '))+'</li>':'')
      +'</ul></div>'
      +'<p class="sub" style="margin-top:16px">Check <b>'+esc(P.email)+'</b> for your webhook links (Slack/Telegram) and next steps. Your workspace starts in Practice mode — watch the team work a full enrollment week before any real family is touched.</p>'
      +'<div class="row"><a class="btn primary" style="text-decoration:none" href="/">Open the console</a><a class="btn ghost" style="text-decoration:none" href="/school">Back to the school page</a></div>';
  }
  function save1(){P.schoolName=$('f_schoolName').value;P.city=$('f_city').value;P.seats=$('f_seats').value;P.seatsOpen=$('f_seatsOpen').value;P.tuition=$('f_tuition').value;}
  function save2(){P.tourTimes=$('f_tourTimes').value;}
  function save3(){P.about=$('f_about').value;P.faqs=$('f_faqs').value;P.neverNotes=$('f_neverNotes').value;}
  function next1(){save1();if(!P.schoolName.trim()){$('err').textContent='Your school needs a name — it is the first thing your bots will say.';return;}STEP=1;render();}
  function next2(){save2();STEP=2;render();}
  function next3(){save3();STEP=3;render();}
  async function create(){
    P.founderName=$('f_founderName').value;P.email=$('f_email').value;P.plan=$('f_plan').value;
    if(!P.founderName.trim()||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(P.email)){$('err').textContent='Add your name and a valid email — your profile and webhook links go there.';return;}
    $('createBtn').textContent='Setting up…';$('createBtn').disabled=true;
    const r=await fetch('/api/public/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:P.founderName,email:P.email,plan:P.plan,pack:'enrollment',company_website:$('company_website').value,school:P})}).then(x=>x.json()).catch(()=>({error:'Network hiccup — try again.'}));
    if(!r.ok){$('err').textContent=r.error||'Something went wrong — try again.';$('createBtn').textContent='Create my enrollment team';$('createBtn').disabled=false;return;}
    STEP=4;render();
  }
  render();
</script>
</body>
</html>
